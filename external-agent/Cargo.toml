[package]
name = "external-agent"
version = "0.1.0"
edition = "2021"
description = "Bounded YAML-configured sender for network protocol validation"
publish = false

[features]
default = []
experimental-receiver = []
packet-capture = ["dep:pcap"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2.2"
hex = "0.4"
hmac = "0.12"
http = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
pcap = { version = "2.4", optional = true }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
h2 = "0.4"

